name: Application checks
on:
  pull_request:
  push:
    branches: [main, feat/milestone-06-quotes]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_SECRET_KEY: CI_ONLY_NOT_A_CREDENTIAL_LEAK_CANARY_M00
      SECURITY_SCAN_CANARY: CI_ONLY_NOT_A_CREDENTIAL_LEAK_CANARY_M00
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: node scripts/check-boundaries.mjs
      - run: npm audit --audit-level=high
      - run: npm run security:check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: foundation-browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/evidence/screenshots/
          retention-days: 14
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:concurrency
      - run: npm run db:advisors
      - run: npm run db:lint
      - run: npm run db:explain

  auth:
    services:
      clamav:
        image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
        env:
          CLAMAV_NO_FRESHCLAMD: "true"
        ports:
          - 3310:3310
        options: --health-cmd "clamdcheck.sh" --health-interval 10s --health-timeout 5s --health-retries 30
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run auth:start > /tmp/auth-start.log 2>&1 || (tail -40 /tmp/auth-start.log; exit 1)
      - run: npm run auth:env
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:auth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-ui-screenshots
          path: |
            docs/evidence/screenshots/auth-*.png
            docs/evidence/screenshots/worker-*.png
            docs/evidence/screenshots/discovery-*.png
            docs/evidence/screenshots/jobs-*.png
          retention-days: 14
