name: Duzelo visual and native QA
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/experience-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - name: Start production app
        run: |
          npm run start > /tmp/duzelo-next.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duzelo-next.log
          exit 1
      - run: mkdir -p test-results
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: duzelo-visual-qa
          path: test-results/
          retention-days: 7
